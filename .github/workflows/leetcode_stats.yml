name: Update LeetCode Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update LeetCode statistics
        env:
          LEETCODE_USERNAME: shubhamdevit
        run: python .github/scripts/update_leetcode_stats.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md stats.json

          if git diff --cached --quiet; then
            echo "No statistics changed."
          else
            git commit -m "chore: update LeetCode statistics"
            git push
          fi
